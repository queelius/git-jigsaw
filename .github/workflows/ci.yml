name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Check out git-native sibling
        run: |
          cd ..
          git clone --depth 1 https://github.com/queelius/git-native.git
          cd git-native
          npm install
          npm run build
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GH_OAUTH_CLIENT_ID: ''
